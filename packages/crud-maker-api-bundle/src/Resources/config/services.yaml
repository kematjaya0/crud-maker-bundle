services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Kematjaya\CrudMakerBundle\Api\Renderer\ApiCrudRenderer: ~
    Kematjaya\CrudMakerBundle\Api\Util\EntityAttributeWriter: ~
    Kematjaya\CrudMakerBundle\Api\Util\RepositoryMethodWriter: ~
    Kematjaya\CrudMakerBundle\Api\Util\RateLimiterConfigWriter: ~
    Kematjaya\CrudMakerBundle\Api\Util\PermissionManifestWriter: ~

    Kematjaya\CrudMakerBundle\Api\Maker\ApiCrudMaker:
        tags: ['maker.command']

    Symfony\Bundle\MakerBundle\FileManager: '@maker.file_manager'

    maker.file_link_formatter:
        class: Symfony\Bundle\MakerBundle\Util\MakerFileLinkFormatter

    maker.file_manager:
        class: Symfony\Bundle\MakerBundle\FileManager
        arguments:
            - '@filesystem'
            - '@maker.autoloader_util'
            - '@maker.file_link_formatter'
            - '%kernel.project_dir%'
            - ~

    maker.autoloader_finder:
        class: Symfony\Bundle\MakerBundle\Util\ComposerAutoloaderFinder
        arguments:
            - ''

    maker.autoloader_util:
        class: Symfony\Bundle\MakerBundle\Util\AutoloaderUtil
        arguments:
            - '@maker.autoloader_finder'

    generator:
        class: Symfony\Bundle\MakerBundle\Generator
        arguments:
            - '@maker.file_manager'
            - ''
            - '@maker.php_compat_util'

    maker.php_compat_util:
        class: Symfony\Bundle\MakerBundle\Util\PhpCompatUtil
        arguments:
            - '@maker.file_manager'

    Symfony\Bundle\MakerBundle\Doctrine\DoctrineHelper:
        arguments:
            - 'App\Entity'
            - '@doctrine'
