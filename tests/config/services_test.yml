services:
    _defaults:
        autowire: true
        autoconfigure: true
    
    filter_type_renderer:
        alias: Kematjaya\CrudMakerBundle\Renderer\FilterTypeRenderer
        public: true
        
    generator:
        class: Symfony\Bundle\MakerBundle\Generator
        public: true
        arguments:
            - '@maker.file_manager'
            - 'Kematjaya\CrudMakerBundle\Tests'
            - '@maker.php_compat_util'

    Symfony\Bundle\MakerBundle\Doctrine\DoctrineHelper:
        public: true
        arguments:
            - 'Kematjaya\CrudMakerBundle\Tests\Entity'
            - '@doctrine'

    Kematjaya\CrudMakerBundle\Renderer\ApiCrudRenderer:
        public: true

    Kematjaya\CrudMakerBundle\Maker\ApiCrudMaker:
        public: true