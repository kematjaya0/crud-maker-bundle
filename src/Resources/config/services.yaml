services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Kematjaya\CrudMakerBundle\Renderer\FilterTypeRenderer: ~
    Kematjaya\CrudMakerBundle\Renderer\ControllerRenderer: ~
    Kematjaya\CrudMakerBundle\Maker\FilterMaker:
        tags: ['maker.command']
        
    Kematjaya\CrudMakerBundle\Maker\CRUDMaker:
        tags: ['maker.command']
       
    Kematjaya\CrudMakerBundle\Maker\CRUDUnitTestMaker:
        tags: ['maker.command']

    # service milik maker-bundle dipakai ulang (bukan didefinisikan ulang), sehingga
    # root namespace, file manager dan command make:* lain tetap memakai konfigurasi maker-bundle
    Symfony\Bundle\MakerBundle\Doctrine\DoctrineHelper:
        alias: maker.doctrine_helper
