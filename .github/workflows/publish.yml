name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # wajib untuk OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest # butuh npm >= 11.5.1
      - run: npm ci
      - run: npm publish --access public # tanpa NODE_AUTH_TOKEN
